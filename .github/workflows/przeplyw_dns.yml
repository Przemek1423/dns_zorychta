name: DNS - CI/CD ZorychtaNet

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
    paths:
      - 'bind-config/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Unikalny tag istniejącego obrazu Docker Hub'
        required: true
        type: string

      target_environment:
        description: 'Środowisko docelowe'
        required: true
        type: choice
        options:
          - Testowe
          - Produkcyjne

      test_run_id:
        description: 'Numer przebiegu z udanym testem TEST (wymagany dla Produkcyjne)'
        required: false
        type: string

  schedule:
    - cron: '23 2 * * 1'

jobs:
  testy-binda:
    if: github.event_name != 'workflow_dispatch'
    name: "BIND - ${{ matrix.test_name }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: "Konfiguracja BIND"
            command: "named-checkconf /etc/bind/named.conf"

          - test_name: "Strefa zorychta.lan"
            command: "named-checkzone zorychta.lan /etc/bind/db.zorychta.lan"

          - test_name: "Strefa odwrotna"
            command: "named-checkzone 60.168.192.in-addr.arpa /etc/bind/db.60.168.192"

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v7

      - name: Budowanie obrazu testowego
        run: docker build -t dns-ci:${{ github.sha }} .

      - name: Walidacja konfiguracji lub strefy
        run: docker run --rm dns-ci:${{ github.sha }} ${{ matrix.command }}

  kontrola-soa:
    name: Kontrola numerow SOA
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Pobranie repozytorium z historia Git
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Porownanie numerow seryjnych SOA
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          ref = os.environ["EVENT_REF"]

          if event == "pull_request":
              base = os.environ["PR_BASE_SHA"]

          elif event == "push":
              if ref.startswith("refs/tags/"):
                  print("Tag Git - kontrola SOA pominięta.")
                  sys.exit(0)

              base = os.environ.get("PUSH_BEFORE", "")

              if not base or set(base) == {"0"}:
                  print("Pierwszy push nowej gałęzi - kontrola SOA pominięta.")
                  sys.exit(0)

          else:
              print(f"Zdarzenie {event} - kontrola SOA pominięta.")
              sys.exit(0)

          head = os.environ["HEAD_SHA"]

          zones = [
              "bind-config/db.zorychta.lan",
              "bind-config/db.60.168.192",
          ]

          def get_serial(content, filename):
              match = re.search(
                  r"\bSOA\b.*?\(\s*(\d+)",
                  content,
                  re.IGNORECASE | re.DOTALL
              )

              if not match:
                  raise ValueError(
                      f"Nie znaleziono numeru SOA w {filename}"
                  )

              return int(match.group(1))

          errors = 0

          for filename in zones:
              diff = subprocess.run(
                  ["git", "diff", "--quiet", base, head, "--", filename]
              )

              if diff.returncode == 0:
                  print(f"{filename}: bez zmian - pomijam.")
                  continue

              if diff.returncode != 1:
                  sys.exit("Błąd podczas sprawdzania zmian Git.")

              old = subprocess.run(
                  ["git", "show", f"{base}:{filename}"],
                  capture_output=True,
                  text=True
              )

              if old.returncode != 0:
                  print(f"{filename}: nowa strefa - pomijam porównanie.")
                  continue

              path = Path(filename)

              if not path.is_file():
                  sys.exit(f"BŁĄD: plik {filename} nie istnieje.")

              old_serial = get_serial(old.stdout, filename)
              new_serial = get_serial(path.read_text(encoding="utf-8"), filename)

              print(f"Strefa: {filename}")
              print(f"Poprzedni SOA: {old_serial}")
              print(f"Aktualny SOA:  {new_serial}")

              if new_serial <= old_serial:
                  print("BŁĄD: numer SOA nie został zwiększony!")
                  errors += 1
              else:
                  print("OK: numer SOA został zwiększony.")

          if errors:
              sys.exit(1)

          print("Kontrola SOA zakończona poprawnie.")
          PY

  analiza-dockerfile:
    name: Analiza Dockerfile (Hadolint)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v7

      - name: Analiza pliku Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
  
  build-and-publish:
    name: Budowanie i publikacja obrazu Docker
    needs:
      - testy-binda
      - kontrola-soa
      - analiza-dockerfile
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.unique_tag.outputs.value }}

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v7

      - name: Konfiguracja Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Logowanie do Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.Login_Docker_Hub }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Wyznaczenie unikalnego tagu obrazu
        id: unique_tag
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE_TAG="b${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "value=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Unikalny tag obrazu: ${IMAGE_TAG}"

      - name: Generowanie tagow i etykiet
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.Login_Docker_Hub }}/dns_zorychta
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.unique_tag.outputs.value }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Sprawdzenie czy niezmienne tagi juz istnieja
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r IMAGE_REF; do
            [ -z "$IMAGE_REF" ] && continue

            case "$IMAGE_REF" in
              *:latest)
                echo "Tag latest jest ruchomy - moze zostac zaktualizowany."
                continue
                ;;
            esac

            if docker buildx imagetools inspect "$IMAGE_REF" >/dev/null 2>&1; then
              echo "::error::Tag $IMAGE_REF juz istnieje. Nie nadpisujemy go."
              exit 1
            fi
          done <<< "$TAGS"

      - name: Budowanie i wyslanie obrazu do Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ github.event_name != 'schedule' && 'type=gha' || '' }}
          cache-to: ${{ github.event_name != 'schedule' && 'type=gha,mode=max' || '' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}

  deploy-test:
    name: Wdrozenie i test DNS na TEST
    needs:
      - build-and-publish
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: test_zorychta
    environment: Testowe
    concurrency:
      group: dns-deploy-test
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      OBRAZ: ${{ vars.Login_Docker_Hub }}/dns_zorychta
      TAG: ${{ needs.build-and-publish.outputs.image_tag }}
      DNS_SERVER_IP: ${{ vars.DNS_SERVER_IP }}

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v7

      - name: Weryfikacja danych wdrozenia
        run: |
          set -euo pipefail
          test -n "${OBRAZ}" || { echo "::error::Brak nazwy obrazu."; exit 1; }
          test -n "${TAG}" || { echo "::error::Brak unikalnego tagu z build-and-publish.outputs."; exit 1; }
          test -n "${DNS_SERVER_IP}" || { echo "::error::Brak DNS_SERVER_IP w srodowisku Testowe."; exit 1; }
          echo "Srodowisko: TEST"
          echo "Wdrazany obraz: ${OBRAZ}:${TAG}"
          echo "Serwer DNS do testow: ${DNS_SERVER_IP}"

      - name: Pobranie obrazu i odtworzenie kontenera
        run: |
          set -euo pipefail
          docker compose --project-name dns_zorychta pull
          docker compose --project-name dns_zorychta up -d --force-recreate
          docker compose --project-name dns_zorychta ps

      - name: Test rekordow A, PTR i numeru SOA
        run: |
          set -euo pipefail

          echo "Sprawdzanie rekordu A www.zorychta.lan..."
          A_RESULT=""
          for attempt in $(seq 1 10); do
            A_RESULT="$(dig "@${DNS_SERVER_IP}" www.zorychta.lan A +short +time=2 +tries=1 || true)"
            if [ -n "${A_RESULT}" ]; then
              break
            fi
            sleep 3
          done
          echo "Wynik A: ${A_RESULT}"
          printf '%s\n' "${A_RESULT}" | grep -Fxq '192.168.60.13' || {
            echo "::error::Rekord A www.zorychta.lan nie wskazuje na PROD (192.168.60.13)."
            exit 1
          }

          echo "Sprawdzanie rekordu PTR dla 192.168.60.13..."
          PTR_RESULT=""
          for attempt in $(seq 1 10); do
            PTR_RESULT="$(dig "@${DNS_SERVER_IP}" -x 192.168.60.13 +short +time=2 +tries=1 | sed 's/\.$//' || true)"
            if [ -n "${PTR_RESULT}" ]; then
              break
            fi
            sleep 3
          done
          echo "Wynik PTR: ${PTR_RESULT}"
          [ "${PTR_RESULT}" = 'prod.zorychta.lan' ] || {
            echo "::error::Rekord PTR dla 192.168.60.13 nie wskazuje na prod.zorychta.lan."
            exit 1
          }

          echo "Odczyt oczekiwanego numeru SOA z pliku strefy w repozytorium..."
          EXPECTED_SOA="$(python3 - <<'PY'
          import re
          from pathlib import Path

          zone_file = Path('bind-config/db.zorychta.lan')
          content = zone_file.read_text(encoding='utf-8')
          match = re.search(r'\bSOA\b.*?\(\s*(\d+)', content, re.IGNORECASE | re.DOTALL)
          if not match:
              raise SystemExit(f'Nie znaleziono numeru SOA w {zone_file}')
          print(match.group(1))
          PY
          )"

          ACTUAL_SOA=""
          for attempt in $(seq 1 10); do
            ACTUAL_SOA="$(dig "@${DNS_SERVER_IP}" zorychta.lan SOA +short +time=2 +tries=1 | awk 'NR == 1 {print $3}' || true)"
            if [ -n "${ACTUAL_SOA}" ]; then
              break
            fi
            sleep 3
          done

          echo "Oczekiwany SOA: ${EXPECTED_SOA}"
          echo "Odczytany SOA:  ${ACTUAL_SOA}"
          [ "${ACTUAL_SOA}" = "${EXPECTED_SOA}" ] || {
            echo "::error::Numer SOA w dzialajacym DNS nie zgadza sie z plikiem strefy z wdrazanego obrazu."
            exit 1
          }

          echo "Test TEST zakonczony poprawnie dla obrazu ${OBRAZ}:${TAG}."

  deploy-prod:
    name: Wdrozenie i test DNS na PROD
    needs:
      - build-and-publish
      - deploy-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: prod_zorychta
    environment: Produkcyjne
    concurrency:
      group: dns-deploy-prod
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      OBRAZ: ${{ vars.Login_Docker_Hub }}/dns_zorychta
      TAG: ${{ needs.build-and-publish.outputs.image_tag }}
      DNS_SERVER_IP: ${{ vars.DNS_SERVER_IP }}

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v7

      - name: Weryfikacja danych wdrozenia
        run: |
          set -euo pipefail
          test -n "${OBRAZ}" || { echo "::error::Brak nazwy obrazu."; exit 1; }
          test -n "${TAG}" || { echo "::error::Brak unikalnego tagu z build-and-publish.outputs."; exit 1; }
          test -n "${DNS_SERVER_IP}" || { echo "::error::Brak DNS_SERVER_IP w srodowisku Produkcyjne."; exit 1; }
          echo "Srodowisko: PROD"
          echo "Wdrazy ten sam obraz, ktory przeszedl test na TEST: ${OBRAZ}:${TAG}"
          echo "Serwer DNS do testow: ${DNS_SERVER_IP}"

      - name: Pobranie obrazu i odtworzenie kontenera
        run: |
          set -euo pipefail
          docker compose --project-name dns_zorychta pull
          docker compose --project-name dns_zorychta up -d --force-recreate
          docker compose --project-name dns_zorychta ps

      - name: Test rekordow A, PTR i numeru SOA
        run: |
          set -euo pipefail

          echo "Sprawdzanie rekordu A www.zorychta.lan..."
          A_RESULT=""
          for attempt in $(seq 1 10); do
            A_RESULT="$(dig "@${DNS_SERVER_IP}" www.zorychta.lan A +short +time=2 +tries=1 || true)"
            if [ -n "${A_RESULT}" ]; then
              break
            fi
            sleep 3
          done
          echo "Wynik A: ${A_RESULT}"
          printf '%s\n' "${A_RESULT}" | grep -Fxq '192.168.60.13' || {
            echo "::error::Rekord A www.zorychta.lan nie wskazuje na PROD (192.168.60.13)."
            exit 1
          }

          echo "Sprawdzanie rekordu PTR dla 192.168.60.13..."
          PTR_RESULT=""
          for attempt in $(seq 1 10); do
            PTR_RESULT="$(dig "@${DNS_SERVER_IP}" -x 192.168.60.13 +short +time=2 +tries=1 | sed 's/\.$//' || true)"
            if [ -n "${PTR_RESULT}" ]; then
              break
            fi
            sleep 3
          done
          echo "Wynik PTR: ${PTR_RESULT}"
          [ "${PTR_RESULT}" = 'prod.zorychta.lan' ] || {
            echo "::error::Rekord PTR dla 192.168.60.13 nie wskazuje na prod.zorychta.lan."
            exit 1
          }

          echo "Odczyt oczekiwanego numeru SOA z pliku strefy w repozytorium..."
          EXPECTED_SOA="$(python3 - <<'PY'
          import re
          from pathlib import Path

          zone_file = Path('bind-config/db.zorychta.lan')
          content = zone_file.read_text(encoding='utf-8')
          match = re.search(r'\bSOA\b.*?\(\s*(\d+)', content, re.IGNORECASE | re.DOTALL)
          if not match:
              raise SystemExit(f'Nie znaleziono numeru SOA w {zone_file}')
          print(match.group(1))
          PY
          )"

          ACTUAL_SOA=""
          for attempt in $(seq 1 10); do
            ACTUAL_SOA="$(dig "@${DNS_SERVER_IP}" zorychta.lan SOA +short +time=2 +tries=1 | awk 'NR == 1 {print $3}' || true)"
            if [ -n "${ACTUAL_SOA}" ]; then
              break
            fi
            sleep 3
          done

          echo "Oczekiwany SOA: ${EXPECTED_SOA}"
          echo "Odczytany SOA:  ${ACTUAL_SOA}"
          [ "${ACTUAL_SOA}" = "${EXPECTED_SOA}" ] || {
            echo "::error::Numer SOA w dzialajacym DNS nie zgadza sie z plikiem strefy z wdrazanego obrazu."
            exit 1
          }

          echo "Test PROD zakonczony poprawnie dla obrazu ${OBRAZ}:${TAG}."

  deploy-existing:
    name: Reczne wdrozenie istniejacego obrazu
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.target_environment == 'Testowe' && 'test_zorychta' || 'prod_zorychta' }}
    environment: ${{ inputs.target_environment }}
    concurrency:
      group: ${{ inputs.target_environment == 'Testowe' && 'dns-deploy-test' || 'dns-deploy-prod' }}
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      OBRAZ: ${{ vars.Login_Docker_Hub }}/dns_zorychta
      TAG: ${{ inputs.image_tag }}
      DNS_SERVER_IP: ${{ vars.DNS_SERVER_IP }}
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      TEST_RUN_ID: ${{ inputs.test_run_id }}

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v7

      - name: Walidacja danych i sprawdzenie istnienia obrazu
        run: |
          set -euo pipefail

          test -n "${OBRAZ}" || { echo "::error::Brak nazwy obrazu."; exit 1; }
          test -n "${TAG}" || { echo "::error::Nie podano tagu obrazu."; exit 1; }
          test -n "${DNS_SERVER_IP}" || { echo "::error::Brak DNS_SERVER_IP w wybranym srodowisku."; exit 1; }

          if [[ ! "${TAG}" =~ ^b[0-9]+-[0-9a-f]{7}$ ]]; then
            echo "::error::Podaj unikalny tag budowania w formacie b<numer>-<7 znakow SHA>, np. b11-3f89eaa."
            exit 1
          fi

          if [ "${TARGET_ENVIRONMENT}" = "Produkcyjne" ]; then
            if [ -z "${TEST_RUN_ID}" ]; then
              echo "::error::Dla PROD podaj numer przebiegu GitHub Actions, w ktorym ten obraz przeszedl testy na TEST."
              exit 1
            fi
            if [[ ! "${TEST_RUN_ID}" =~ ^[0-9]+$ ]]; then
              echo "::error::Numer przebiegu TEST musi byc liczba, np. 11."
              exit 1
            fi
            echo "Potwierdzenie operatora: obraz ${OBRAZ}:${TAG} przeszedl TEST w przebiegu #${TEST_RUN_ID}."
            echo "Automatyczna weryfikacja wskazanego przebiegu nie jest wlaczona; sprawdz jego wynik i tag obrazu przed zatwierdzeniem PROD."
          else
            echo "Wybrane srodowisko: TEST."
          fi

          echo "Sprawdzanie, czy obraz ${OBRAZ}:${TAG} istnieje w Docker Hub..."
          docker pull "${OBRAZ}:${TAG}"
          echo "Obraz istnieje i zostal pobrany. Nie wykonujemy budowania ani publikowania."

      - name: Wdrozenie wskazanego obrazu przez Docker Compose
        run: |
          set -euo pipefail
          echo "Wdrazenie ${OBRAZ}:${TAG} na ${TARGET_ENVIRONMENT}."
          docker compose --project-name dns_zorychta pull
          docker compose --project-name dns_zorychta up -d --force-recreate
          docker compose --project-name dns_zorychta ps

      - name: Test rekordow A, PTR i numeru SOA obrazu
        run: |
          set -euo pipefail

          echo "Sprawdzanie rekordu A www.zorychta.lan..."
          A_RESULT=""
          for attempt in $(seq 1 10); do
            A_RESULT="$(dig "@${DNS_SERVER_IP}" www.zorychta.lan A +short +time=2 +tries=1 || true)"
            if [ -n "${A_RESULT}" ]; then
              break
            fi
            sleep 3
          done
          echo "Wynik A: ${A_RESULT}"
          printf '%s\n' "${A_RESULT}" | grep -Fxq '192.168.60.13' || {
            echo "::error::Rekord A www.zorychta.lan nie wskazuje na PROD (192.168.60.13)."
            exit 1
          }

          echo "Sprawdzanie rekordu PTR dla 192.168.60.13..."
          PTR_RESULT=""
          for attempt in $(seq 1 10); do
            PTR_RESULT="$(dig "@${DNS_SERVER_IP}" -x 192.168.60.13 +short +time=2 +tries=1 | sed 's/\.$//' || true)"
            if [ -n "${PTR_RESULT}" ]; then
              break
            fi
            sleep 3
          done
          echo "Wynik PTR: ${PTR_RESULT}"
          [ "${PTR_RESULT}" = 'prod.zorychta.lan' ] || {
            echo "::error::Rekord PTR dla 192.168.60.13 nie wskazuje na prod.zorychta.lan."
            exit 1
          }

          echo "Odczyt numeru SOA bezposrednio z pliku strefy we wdrozonym kontenerze..."
          DEPLOYED_ZONE_FILE="$(mktemp)"
          docker exec serwer-dns cat /etc/bind/db.zorychta.lan > "${DEPLOYED_ZONE_FILE}"
          EXPECTED_SOA="$(python3 - "${DEPLOYED_ZONE_FILE}" <<'PY'
          import re
          import sys
          from pathlib import Path

          filename = Path(sys.argv[1])
          content = filename.read_text(encoding='utf-8')
          match = re.search(r'\bSOA\b.*?\(\s*(\d+)', content, re.IGNORECASE | re.DOTALL)
          if not match:
              raise SystemExit('Nie znaleziono numeru SOA w pliku strefy wdrozonego kontenera.')
          print(match.group(1))
          PY
          )"
          rm -f "${DEPLOYED_ZONE_FILE}"

          ACTUAL_SOA=""
          for attempt in $(seq 1 10); do
            ACTUAL_SOA="$(dig "@${DNS_SERVER_IP}" zorychta.lan SOA +short +time=2 +tries=1 | awk 'NR == 1 {print $3}' || true)"
            if [ -n "${ACTUAL_SOA}" ]; then
              break
            fi
            sleep 3
          done

          echo "SOA w pliku wdrozonego obrazu: ${EXPECTED_SOA}"
          echo "SOA odczytany z serwera DNS:   ${ACTUAL_SOA}"
          [ "${ACTUAL_SOA}" = "${EXPECTED_SOA}" ] || {
            echo "::error::Numer SOA w dzialajacym DNS nie zgadza sie z plikiem strefy wdrozonego obrazu."
            exit 1
          }

          echo "Reczne wdrozenie i testy zakonczone poprawnie: ${OBRAZ}:${TAG} na ${TARGET_ENVIRONMENT}."
